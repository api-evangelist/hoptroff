aid: hoptroff
name: Hoptroff
description: >-
  Hoptroff is a London-based precision timing company that delivers Traceable
  Time as a Service (TTaaS), providing enterprise-grade, traceable UTC time with
  guaranteed SLA accuracy to any data center or cloud environment. Founded in
  2015 by Richard Hoptroff, the company operates a global network of atomic
  timing hubs in London, New York, and Tokyo, delivering microsecond-level
  precision over IEEE 1588 Precision Time Protocol (PTP) and NTP. Its Certified
  Time and Terrestrial Time Feed products let organizations timestamp and audit
  automated events without a satellite dependency, using resilient multi-source
  feeds (three satellite feeds plus a terrestrial feed from the RISE Institute of
  Sweden) that are hardened against GPS spoofing and network failure. Hoptroff is
  certified to ISO 27001 and ISO 9001, and its time synchronization is licensed
  as an API so a consistent, compliant timescale can be applied across an
  enterprise for use cases in financial services (MiFID II timestamping and
  high-frequency trading), content streaming, gaming, IoT, and distributed
  ledger technology.
